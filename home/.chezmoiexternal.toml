# Third-party oh-my-zsh plugins, fetched by chezmoi (refreshed weekly).
# oh-my-zsh itself is NOT managed here: it auto-updates itself (zstyle ':omz:update' mode auto).
# On a new Mac install oh-my-zsh first, then `chezmoi apply`.
# Spaceship theme is not managed yet (needs a symlink into custom/themes).
[".oh-my-zsh/custom/plugins/zsh-syntax-highlighting"]
  type = "archive"
  url = "https://github.com/zsh-users/zsh-syntax-highlighting/archive/master.tar.gz"
  stripComponents = 1
  refreshPeriod = "168h"

[".oh-my-zsh/custom/plugins/zsh-autosuggestions"]
  type = "archive"
  url = "https://github.com/zsh-users/zsh-autosuggestions/archive/master.tar.gz"
  stripComponents = 1
  refreshPeriod = "168h"
